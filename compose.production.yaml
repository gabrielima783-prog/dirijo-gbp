services:
  app:
    image: dirijo-gbp:${VPS_OPS_RELEASE_ID:?}
    build:
      context: .
      labels:
        com.gabriel.vps-project: dirijo-gbp
        com.gabriel.vps-release: ${VPS_OPS_RELEASE_ID:?}
    labels:
      com.gabriel.vps-project: dirijo-gbp
      com.gabriel.vps-release: ${VPS_OPS_RELEASE_ID:?}
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 1.0
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports: ["127.0.0.1:3006:8787"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      AUTH_ENABLED: "true"
      PUBLIC_URL: https://gbp.dirijobr.com
      ADDITIONAL_PUBLIC_ORIGINS: https://gbp.viradadonutri.com.br
      DATABASE_FILE: /app/data/dirijo-gbp.sqlite
      ASSETS_DIR: /app/data/assets
      ANALYSIS_COST_LIMIT_USD: "1"
      APIFY_TOKEN_FILE: /run/secrets/apify-token
      OPENAI_API_KEY_FILE: /run/secrets/openai-api-key
      PAGESPEED_API_KEY_FILE: /run/secrets/pagespeed-api-key
    volumes:
      - ${VPS_OPS_INSTALL_ROOT:?}/data:/app/data
      - ${VPS_OPS_INSTALL_ROOT:?}/state/production/secrets/apify-token:/run/secrets/apify-token:ro
      - ${VPS_OPS_INSTALL_ROOT:?}/state/production/secrets/openai-api-key:/run/secrets/openai-api-key:ro
      - ${VPS_OPS_INSTALL_ROOT:?}/state/production/secrets/pagespeed-api-key:/run/secrets/pagespeed-api-key:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    user: "1000:1000"
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel-token]
    volumes:
      - ${VPS_OPS_INSTALL_ROOT:?}/state/production/secrets/tunnel-token:/run/secrets/tunnel-token:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
